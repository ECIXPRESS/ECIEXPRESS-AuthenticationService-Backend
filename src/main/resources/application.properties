server.port=8082
spring.application.name=authentication-service

# JWT Configuration
jwt.secret=mySuperSecretKeyForJWTTokenGenerationInAuthenticationService123!
jwt.expiration=86400000

# External Service Configuration
external.user-service.url=http://localhost:8081/api/users

# Swagger/OpenAPI Configuration
springdoc.api-docs.path=/api-docs
springdoc.swagger-ui.path=/swagger-ui.html
springdoc.swagger-ui.enabled=true

# Logging
logging.level.edu.dosw=DEBUG
logging.level.org.springframework.web=INFO
logging.level.org.springframework.web.client=DEBUG

# Security (para PasswordEncoder)
spring.security.oauth2.resourceserver.jwt.issuer-uri=http://localhost:8082
